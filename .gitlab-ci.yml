# The same gate as .github/workflows/ci.yml, for GitLab.
#
# Kept deliberately parallel to that file: same steps, same order, same reasons.
# If you change one, change the other, or the two hosts will disagree about
# whether a commit is good.

stages:
  - verify
  - schema

default:
  image: node:24
  # corepack's shim reads packageManager from package.json on first use, so the
  # pnpm version is pinned by the repo rather than by this file drifting out of
  # date. Nothing here names a version.
  before_script:
    - corepack enable
    - pnpm config set store-dir .pnpm-store
    - pnpm install --frozen-lockfile
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Everything here runs without a single credential, on purpose: the suite must
# be runnable by anyone who clones the repo, and a gate that needs secrets is a
# gate nobody runs. The three database steps start their own throwaway Postgres.
verify:
  stage: verify
  # Two Postgres instances, a production build and a browser run.
  timeout: 25 minutes
  variables:
    # Build-time only. src/db/tenant.ts throws without it, and no query runs
    # during a build or against a signed-out route.
    DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
    NEXT_PUBLIC_SUPABASE_URL: https://build.invalid
    NEXT_PUBLIC_SUPABASE_ANON_KEY: build-placeholder
  script:
    - pnpm typecheck
    - pnpm lint
    - pnpm test
    - pnpm db:test
    - pnpm test:integration
    - pnpm build
    # --with-deps because node:24 is Debian without the libraries Chromium
    # needs; the GitHub runner already has them and does not pass it.
    - pnpm exec playwright install --with-deps chromium
    # Signed-out routing through a real browser. Reaches no Supabase: an
    # unauthenticated visitor is redirected before any query, which is the
    # claim under test. The five daily-loop flows need a real magic-link
    # session and are deliberately not here — see the README.
    - pnpm test:e2e --project=public
  artifacts:
    when: on_failure
    expire_in: 7 days
    paths:
      - playwright-report/
      - test-results/

# Separate from verify because it needs the owner connection. db:test proves a
# migration against a scratch database, which is not the same as having run it:
# 0014 and 0015 sat unapplied while every other check stayed green, and the
# first sign was a report failing live on a missing column.
#
# Set ADMIN_DATABASE_URL in Settings > CI/CD > Variables, protected and masked.
# Without it this warns instead of failing, so a fork is never blocked by a
# database it cannot reach.
schema-drift:
  stage: schema
  timeout: 5 minutes
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if [ -z "$ADMIN_DATABASE_URL" ]; then
        echo "WARNING: ADMIN_DATABASE_URL is not set — schema drift was NOT checked."
        exit 0
      fi
      pnpm db:check
